name: Quality

on:
  push:
    branches: [main]
  pull_request:
  # A manual run also mutates the whole package; see the mutation-full job.
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Same Xcode and signing setup as tests.yml: a pinned version, and no team
# identity on CI, so everything is signed ad hoc.
env:
  XCODE_VERSION: "26.6"
  SIGNING: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

jobs:
  static:
    name: Format, lint, duplication, secrets
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks and the commit-message check read the history
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            .build/quality-tools
          key: quality-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml', 'Scripts/quality/tool') }}
      - name: Install pre-commit
        run: pip install pre-commit==4.6.2
      # The same hooks a commit runs, on every file. The output is kept for the
      # summary comment, which reads each hook's result from it.
      - name: Run the commit hooks on the whole tree
        run: |
          set -o pipefail
          mkdir -p build/gate
          pre-commit run --all-files --show-diff-on-failure --color=always | tee build/gate/hooks.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-hooks
          path: build/gate/hooks.txt
          if-no-files-found: ignore
      - name: Look for secrets in the whole history
        run: pre-commit run gitleaks-history --hook-stage manual --all-files --color=always
      - name: Check the pull request's commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            pre-commit run conventional-pre-commit --hook-stage commit-msg \
              --commit-msg-filename "$RUNNER_TEMP/message" --color=always || failed=1
          done
          exit "$failed"

  compiled:
    name: Warnings as errors, unused code
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .build/quality-tools
          key: quality-compiled-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/quality/tool') }}
      # build-for-testing compiles the test targets too, and the index it
      # leaves in build/DerivedData is what the unused-code scan reads.
      - name: Build everything with warnings as errors
        run: |
          # shellcheck disable=SC2086 # $SIGNING is a list of build settings
          Scripts/quality/build-strict $SIGNING
      - name: Look for unused code
        run: Scripts/quality/unused-code --skip-build

  mutation:
    name: Mutation testing (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script diffs against the pull request's base
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Mutate the lines this pull request changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: Scripts/quality/mutation --base "$BASE" --report build/gate/mutation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-mutation
          path: build/gate/mutation.json
          if-no-files-found: ignore

  # One comment on the pull request with every gate's reading beside its
  # baseline, rewritten on each run. Coverage and the sanitizer live in the Tests
  # workflow, so this waits for that run of the same commit. A fork's token
  # cannot write to the pull request, so the job runs only for branches of this
  # repository.
  summary:
    name: Summary comment
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [static, compiled, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Tests run of this commit
        id: tests
        run: |
          run=$(gh run list --workflow Tests --commit "$HEAD_SHA" --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            gh run watch "$run" --interval 15 > /dev/null || true
          fi
      - name: Collect this run's reports
        uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: build/reports
      - name: Collect the Tests run's reports
        if: steps.tests.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: build/reports
          run-id: ${{ steps.tests.outputs.run }}
          github-token: ${{ github.token }}
      - name: Collect the job results
        env:
          TESTS_RUN: ${{ steps.tests.outputs.run }}
        run: |
          mkdir -p build/reports
          gh run view "$GITHUB_RUN_ID" --json jobs > build/reports/quality-jobs.json
          if [ -n "$TESTS_RUN" ]; then
            gh run view "$TESTS_RUN" --json jobs > build/reports/tests-jobs.json
          fi
      - name: Write the comment
        run: |
          Scripts/quality/summary --reports build/reports --commit "$HEAD_SHA" > build/comment.md
          cat build/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish it on the pull request
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- quality-gates-summary -->")) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@build/comment.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@build/comment.md > /dev/null
          fi

  mutation-full:
    name: Mutation testing (whole package)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Mutate the whole package
        run: Scripts/quality/mutation --all --report build/mutation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: build/mutation.json
