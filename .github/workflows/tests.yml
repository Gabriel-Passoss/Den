name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The project needs Xcode 27 (macOS 26.6 SDK). CI builds without the team's
# signing identity, so everything is signed ad hoc.
env:
  SIGNING: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

jobs:
  harnesskit:
    name: HarnessKit
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^27.0'
      - name: Test the package
        run: swift test --package-path Packages/HarnessKit

  app:
    name: App (unit + pipeline E2E)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^27.0'
      - name: Test the app
        run: |
          xcodebuild test \
            -project DevSpace.xcodeproj -scheme DevSpace \
            -destination 'platform=macOS' \
            -resultBundlePath build/app.xcresult \
            $SIGNING
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-xcresult
          path: build/app.xcresult

  ui:
    name: UI (XCUITest)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^27.0'
      - name: Allow UI automation without a password prompt
        run: sudo automationmodetool enable-automationmode-without-authentication
      - name: Test the UI
        run: |
          xcodebuild test \
            -project DevSpace.xcodeproj -scheme DevSpaceUITests \
            -destination 'platform=macOS' \
            -resultBundlePath build/ui.xcresult \
            $SIGNING
      # A failing UI test attaches the accessibility tree; read it from here.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-xcresult
          path: build/ui.xcresult
