name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "27.0"
  SIGNING: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=

jobs:
  harnesskit:
    name: HarnessKit
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
        with:
          version: ${{ env.XCODE_VERSION }}
      - name: Test the package
        run: swift test --package-path Packages/HarnessKit --enable-code-coverage
      - name: Check the coverage floor
        run: Scripts/quality/coverage package

  app:
    name: App (unit + pipeline E2E)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
        with:
          version: ${{ env.XCODE_VERSION }}
      - name: Test the app
        run: |
          # shellcheck disable=SC2086 # $SIGNING is a list of build settings
          xcodebuild test \
            -project Den.xcodeproj -scheme Den \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath build/app.xcresult \
            $SIGNING
      - name: Check the coverage floor
        run: Scripts/quality/coverage app build/app.xcresult
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-xcresult
          path: build/app.xcresult

  sanitizer:
    name: Thread Sanitizer
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
        with:
          version: ${{ env.XCODE_VERSION }}
      # A data race fails either command on its own; no sanitizer option is needed.
      - name: Test the package under Thread Sanitizer
        run: swift test --package-path Packages/HarnessKit --sanitize=thread
      - name: Test the app under Thread Sanitizer
        run: |
          # shellcheck disable=SC2086 # $SIGNING is a list of build settings
          xcodebuild test \
            -project Den.xcodeproj -scheme Den \
            -destination 'platform=macOS' \
            -enableThreadSanitizer YES \
            -resultBundlePath build/tsan.xcresult \
            $SIGNING
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tsan-xcresult
          path: build/tsan.xcresult

  ui:
    name: UI (XCUITest)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
        with:
          version: ${{ env.XCODE_VERSION }}
      - name: Test the UI
        run: |
          # shellcheck disable=SC2086 # $SIGNING is a list of build settings
          xcodebuild test \
            -project Den.xcodeproj -scheme DenUITests \
            -destination 'platform=macOS' \
            -resultBundlePath build/ui.xcresult \
            $SIGNING
      # A failing UI test attaches the accessibility tree; read it from here.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-xcresult
          path: build/ui.xcresult
