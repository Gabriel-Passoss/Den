[package]
name = "den-desktop"
version = "1.0.0"
description = "Den desktop workspace"
edition = "2021"
rust-version = "1.98.1"
publish = false

[lib]
name = "den_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
