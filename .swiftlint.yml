# SwiftLint: correctness, idioms, size limits and the house rules at the end
# (no comments, module boundaries), checked on every commit and
# in CI with --strict, so a warning fails too. Layout is SwiftFormat's job
# (.swiftformat), and the rules here that would fight it are off.
#
# Violations that were already in the code are recorded in
# .swiftlint-baseline.json and reported only once they change; anything new
# fails. docs/quality.md explains how to refresh it.

included:
  - Den
  - DenTests
  - DenUITests
  - DenTestSupport
  - Packages/HarnessKit/Sources
  - Packages/HarnessKit/Tests
excluded:
  - "**/.build"
  - Packages/HarnessKit/Tests/*/Fixtures

disabled_rules:
  # Layout SwiftFormat already decides, sometimes the other way.
  - closure_parameter_position
  - statement_position # `if a { … }` and `else { … }` on their own lines is fine
  - trailing_comma # SwiftFormat adds one to every multi-line collection
  # Reports a ternary inside a switch expression, which returns a value.
  - void_function_in_ternary
  # `String(decoding:as:)` is lossy on purpose: CLI output is shown, not parsed.
  - optional_data_string_conversion

opt_in_rules:
  # Bugs and crashes waiting to happen.
  - discarded_notification_center_observer
  - fatal_error_message
  - force_unwrapping
  - identical_operands
  - lower_acl_than_parent
  - overridden_super_call
  - override_in_extension
  - private_swiftui_state
  - prohibited_super_call
  - unhandled_throwing_task
  - unowned_variable_capture
  - weak_delegate
  - yoda_condition
  # Tests that silently stop running or asserting.
  - empty_xctest_method
  - final_test_case
  - test_case_accessibility
  - xct_specific_matcher
  # Simpler or faster ways to say the same thing.
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_none_name
  - empty_count
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - redundant_nil_coalescing
  - reduce_into
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  # Text that reads one way and compiles another.
  - invisible_character
  - local_doc_comment

# The code uses one-letter names in short closures and patterns (`a`, `b`, `i`).
identifier_name:
  min_length: 1
  max_length: 50

line_length:
  warning: 160
  ignores_urls: true

# Size limits for new code. Code that was over them already is in the baseline.
file_length:
  warning: 500
  ignore_comment_only_lines: true
type_body_length:
  warning: 300
function_body_length:
  warning: 60
cyclomatic_complexity:
  warning: 12
  ignores_case_statements: true # a flat switch over cases reads as one decision
large_tuple:
  warning: 3
nesting:
  type_level: 2 # e.g. TranscriptEntry.Kind.CodingKeys

# House rules. Custom rules match the absolute path of a file, and the checkout
# is itself called Den, so the patterns below rule out Packages by name instead
# of trusting `Den/` to mean the app.
custom_rules:
  no_comments:
    name: "No comments"
    regex: '(//|/\*)(?!\s*(swiftlint|swiftformat|periphery|jscpd|swift-tools-version):)'
    match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field]
    message: "Let names and structure carry the intent; only tool directives may be comments."
    severity: error
  headless_harnesskit:
    name: "HarnessKit is headless"
    included: ".*/Packages/HarnessKit/Sources/.*\\.swift"
    regex: '^\s*(@\w+\s+)*import\s+((typealias|struct|class|enum|protocol|let|var|func)\s+)?(SwiftUI|AppKit|UIKit|Combine)\b'
    message: "HarnessKit must not import a UI framework."
    severity: error
  concrete_harness_outside_registry:
    name: "Concrete harnesses stay behind the registry"
    included: ".*/(Den|DenTests|DenUITests|DenTestSupport)/.*\\.swift"
    excluded: ".*/(Packages|Den/Harness)/.*"
    regex: '^\s*(@\w+\s+)*import\s+((typealias|struct|class|enum|protocol|let|var|func)\s+)?(ClaudeHarness|OpenCodeHarness)\b'
    message: "Only Den/Harness may import a concrete harness; everything else goes through HarnessCore."
    severity: error
  shared_knows_no_harness:
    name: "Shared is harness-free"
    included: ".*/Den/Shared/.*\\.swift"
    regex: '^\s*(@\w+\s+)*import\s+((typealias|struct|class|enum|protocol|let|var|func)\s+)?HarnessCore\b'
    message: "Den/Shared must not depend on HarnessCore."
    severity: error
  sqlite_behind_sqlitekit:
    name: "SQLite stays behind SQLiteKit"
    excluded: ".*/Packages/HarnessKit/Sources/SQLiteKit/.*"
    regex: '^\s*(@\w+\s+)*import\s+((typealias|struct|class|enum|protocol|let|var|func)\s+)?SQLite3\b'
    message: "Only SQLiteKit may import SQLite3; everything else goes through DenStore."
    severity: error
  sqlitekit_behind_denstore:
    name: "SQLiteKit stays behind DenStore"
    excluded: ".*/Packages/HarnessKit/(Sources|Tests)/(SQLiteKit|SQLiteKitTests|DenStore|DenStoreTests)/.*"
    regex: '^\s*(@\w+\s+)*import\s+((typealias|struct|class|enum|protocol|let|var|func)\s+)?SQLiteKit\b'
    message: "Only DenStore may import SQLiteKit; everything else goes through a repository protocol."
    severity: error

reporter: xcode
